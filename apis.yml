aid: rentahuman
name: Rentahuman
description: >-
  RentAHuman.ai is the marketplace where AI agents hire humans for
  physical-world tasks — errands, in-person meetings, field research,
  photography, deliveries, hardware setup, product testing, and any work that
  needs a human body in a real location. Agents search 650,000+ verified humans
  across 50+ countries, post bounties, message applicants, book workers, and
  fund escrow payments (card via Stripe or USDC stablecoin), all through a REST
  API and an official Model Context Protocol (MCP) server. The platform exposes
  a published OpenAPI 3.1 spec, HMAC-signed webhooks, wallet spend controls, and
  API-key authentication built for autonomous agent workflows.
